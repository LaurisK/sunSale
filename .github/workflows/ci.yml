name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly cron so new Home Assistant releases are exercised by the import-smoke
  # and hassfest/HACS jobs even when the repo is idle. The whole workflow runs
  # (~1 min); no per-job scheduling guard is needed.
  schedule:
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite mocks Home Assistant wholesale in tests/conftest.py (it injects
      # stub modules into sys.modules), so it needs no real HA install — only the
      # test runner. Deliberately NOT installing requirements_dev.txt: its
      # pytest-homeassistant-custom-component plugin imports real HA at plugin
      # init, before conftest runs, which would shadow the stubs and change what
      # is under test. `textual` is required because test_baked_observed_check.py
      # imports through tools.integration_check, whose TUI (tools/checks/app.py)
      # imports textual (rich comes in transitively).
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov textual
      - name: Run test suite
        run: >-
          pytest -q
          --cov=custom_components/sun_sale --cov=tools
          --cov-report=term-missing:skip-covered
          --cov-report=xml
      # Record the coverage baseline in the run summary. No --cov-fail-under gate
      # yet — introduce one (a few points below baseline) only after the number
      # has been stable for a few weeks.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            python -m coverage report --skip-covered | tail -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check custom_components tools tests

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mypy is configured with ignore_missing_imports (pyproject.toml), so it
      # resolves the pure-Python sources from the tree and skips the unresolved
      # `homeassistant` imports — no HA install needed to reproduce a clean run.
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy custom_components/sun_sale

  import-smoke:
    name: import-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Latest stable HA, deliberately unpinned so API drift surfaces here in CI
      # rather than on the live install. Imports the integration against real HA
      # to catch renamed/removed symbols the mocked unit suite cannot see.
      - name: Install Home Assistant
        run: pip install homeassistant
      - name: Import every integration module
        run: python tools/ci_import_check.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The integration domain is not yet registered in home-assistant/brands,
          # so the brands check would fail. Temporary, documented exception —
          # remove once the domain is submitted upstream.
          ignore: brands

  upstream-contract:
    name: solis_modbus contract
    runs-on: ubuntu-latest
    # sunSale's Remote Dispatch path calls another integration's services and
    # resolves its entities by unique-id slug. Neither is a versioned API, and a
    # rename there fails *silently* at runtime (the service call is rejected and
    # swallowed by the "log, don't propagate" write rule) — so it is checked
    # here instead, against both the latest release and master. `master` is
    # allowed to fail: it is an early warning about an unreleased change, not a
    # reason to block a sunSale PR.
    strategy:
      fail-fast: false
      matrix:
        ref: [latest-release, master]
    continue-on-error: ${{ matrix.ref == 'master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pyyaml
      - name: Check out solis_modbus
        run: |
          git clone --quiet https://github.com/Pho3niX90/solis_modbus.git upstream-solis
          cd upstream-solis
          if [ "${{ matrix.ref }}" = "latest-release" ]; then
            tag="$(git describe --tags "$(git rev-list --tags --max-count=1)")"
            echo "Checking out latest release tag: $tag"
            git checkout --quiet "$tag"
          fi
          git log -1 --oneline
      - name: Run the contract guard
        env:
          SOLIS_MODBUS_PATH: ${{ github.workspace }}/upstream-solis
        run: pytest -q tests/test_solis_modbus_contract.py -p no:cacheprovider
